name: Test Markdown Files
# This workflow lints Markdown files in the repository.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: 'markdown2html'
  push: # Add push trigger
    branches:
      - '**' # Match all branches

jobs:
  lint-markdown:
    name: Lint Markdown Files
    runs-on: ubuntu-20.04

    steps:
      - uses: actions/checkout@v4
        with:
          # Use the branch specified in workflow_dispatch input
          ref: ${{ github.event.inputs.branch }}
      - name: Lint Markdown files
        run: |
          npm install -g markdownlint-cli
          markdownlint "docs/**/*.md"


